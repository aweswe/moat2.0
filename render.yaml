services:
  - type: web
    name: agenttracemain
    runtime: python
    rootDir: .
    buildCommand: pip install packages/python-sdk && pip install -r apps/backend/requirements.txt
    startCommand: cd apps/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: AGENTTRACE_API_URL
        value: https://agnettrace.vercel.app/api
      - key: AGENTTRACE_API_KEY
        sync: false
    healthCheckPath: /health
    plan: free
